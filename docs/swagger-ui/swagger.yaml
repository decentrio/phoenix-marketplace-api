          in: path
          required: true
          type: string
      tags:
        - CollectionQuery
  /collections:
    get:
      operationId: Collections
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              collections:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    metadata:
                      type: object
