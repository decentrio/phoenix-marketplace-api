  /collection/{address}:
    get:
      operationId: CollectionDetail
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  metadata:
                    type: object
                  totalItems:
                    type: integer
                    format: int64
                  nfts:
                    type: array
                    items:
                      type: object
                      properties:
                        nid:
                          type: string
                        id:
                          type: string
                        metadata:
                          type: object
